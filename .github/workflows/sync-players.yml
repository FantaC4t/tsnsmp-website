name: Sync Player List

# ──────────────────────────────────────────────────────────────────────────────
# Triggers:
#   1. Push to main when player_extras.json is edited  → instant sync after you
#      update a player's colour / pronouns / role
#   2. Daily at 06:00 UTC                              → picks up whitelist
#      changes made on the server side overnight
#   3. workflow_dispatch                               → manual "Run workflow"
#      button in the GitHub Actions tab
# ──────────────────────────────────────────────────────────────────────────────
# Required repository secrets (Settings → Secrets → Actions):
#   SFTP_HOST                – your game server's SFTP hostname or IP
#   SFTP_PORT                – SFTP port (usually 22)
#   SFTP_USER                – SFTP username
#   SFTP_PASS                – SFTP password
#   SFTP_WHITELIST_PATH      – path to whitelist.json
#                              (e.g.  /whitelist.json  or  /home/container/whitelist.json)
#   SFTP_OPS_PATH            – path to ops.json
#                              (e.g.  /ops.json  or  /home/container/ops.json)
#   SFTP_PLAYERDATA_PATH     – path to player_data.json
#                              (e.g.  /config/playerstatus/player_data.json)
#   SFTP_PRONOUNS_PATH       – path to pronouns.dat
#                              (e.g.  /world/playerdata/pronouns.dat)
#   FIREBASE_SERVICE_ACCOUNT – paste the ENTIRE contents of your Firebase
#                              service account JSON as one line
# ──────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [main]
    paths:
      - 'scripts/player_extras.json'
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  sync:
    name: Sync players → Firebase
    runs-on: self-hosted

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install dependencies
        working-directory: scripts
        run: npm install

      - name: Run sync script
        working-directory: scripts
        env:
          SFTP_HOST:                ${{ secrets.SFTP_HOST }}
          SFTP_PORT:                ${{ secrets.SFTP_PORT }}
          SFTP_USER:                ${{ secrets.SFTP_USER }}
          SFTP_PASS:                ${{ secrets.SFTP_PASS }}
          SFTP_WHITELIST_PATH:      ${{ secrets.SFTP_WHITELIST_PATH }}
          SFTP_OPS_PATH:            ${{ secrets.SFTP_OPS_PATH }}
          SFTP_PLAYERDATA_PATH:     ${{ secrets.SFTP_PLAYERDATA_PATH }}
          SFTP_PRONOUNS_PATH:       ${{ secrets.SFTP_PRONOUNS_PATH }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node sync-players.js
