<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>OG Image Generator – TSNSMP</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #0f0f23;
            color: #e8e9ea;
            font-family: 'Segoe UI', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem 1rem;
            gap: 1.5rem;
        }
        h1 { font-size: 1.2rem; color: #16C4C4; letter-spacing: 0.05em; }
        p.hint { font-size: 0.8rem; color: #888; text-align: center; }
        canvas {
            border: 1px solid #2a2a3e;
            border-radius: 8px;
            max-width: 100%;
            box-shadow: 0 8px 40px rgba(0,0,0,0.6);
        }
        .controls {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
        }
        .controls label { font-size: 0.8rem; color: #aaa; }
        .controls input[type="range"] { accent-color: #16C4C4; width: 120px; }
        .controls input[type="color"] { border: none; background: none; width: 40px; height: 32px; cursor: pointer; }
        button {
            padding: 10px 28px;
            background: linear-gradient(135deg, #52C228, #16C4C4);
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        button:hover { opacity: 0.85; }
        .row { display: flex; align-items: center; gap: 0.5rem; }
    </style>
</head>
<body>
    <h1>OG Image Generator</h1>
    <p class="hint">Renders a 1200×630 preview. Tweak the options, then download.</p>

    <canvas id="og" width="1200" height="630"></canvas>

    <div class="controls">
        <div class="row">
            <label>Logo scale</label>
            <input type="range" id="logoScale" min="30" max="90" value="58" step="1">
        </div>
        <div class="row">
            <label>Logo Y offset</label>
            <input type="range" id="logoY" min="-150" max="100" value="-30" step="1">
        </div>
        <div class="row">
            <label>Tagline</label>
            <input type="text" id="tagline" value="Season 3 is live 🌸"
                style="background:#1a1a2e;border:1px solid #333;color:#e8e9ea;padding:5px 10px;border-radius:6px;font-size:0.85rem;width:180px;">
        </div>
        <div class="row">
            <label>Domain</label>
            <input type="text" id="domain" value="tsnsmp.online"
                style="background:#1a1a2e;border:1px solid #333;color:#e8e9ea;padding:5px 10px;border-radius:6px;font-size:0.85rem;width:150px;">
        </div>
        <button id="dlBtn">⬇ Download PNG</button>
    </div>

    <script>
        const canvas = document.getElementById('og');
        const ctx    = canvas.getContext('2d');
        const W = 1200, H = 630;

        const titleImg = new Image();
        titleImg.src   = '../assets/minecraft_title(1).png';
        titleImg.crossOrigin = 'anonymous';

        // Redraw whenever inputs change
        const inputs = ['logoScale','logoY','tagline','domain'];
        inputs.forEach(id => document.getElementById(id).addEventListener('input', draw));
        titleImg.onload = draw;

        function draw() {
            const logoScalePct = Number(document.getElementById('logoScale').value) / 100;
            const logoYOff     = Number(document.getElementById('logoY').value);
            const tagline      = document.getElementById('tagline').value;
            const domain       = document.getElementById('domain').value;

            ctx.clearRect(0, 0, W, H);

            // ── Base dark background ──
            ctx.fillStyle = '#0a0a18';
            ctx.fillRect(0, 0, W, H);

            // ── Hero-style radial blobs (matching hero-bg CSS) ──
            const blob1 = ctx.createRadialGradient(W*0.15, H*0.5, 0, W*0.15, H*0.5, W*0.35);
            blob1.addColorStop(0,   'rgba(82,194,40,0.18)');
            blob1.addColorStop(1,   'rgba(82,194,40,0)');
            ctx.fillStyle = blob1;
            ctx.fillRect(0, 0, W, H);

            const blob2 = ctx.createRadialGradient(W*0.85, H*0.3, 0, W*0.85, H*0.3, W*0.35);
            blob2.addColorStop(0,   'rgba(22,196,196,0.2)');
            blob2.addColorStop(1,   'rgba(22,196,196,0)');
            ctx.fillStyle = blob2;
            ctx.fillRect(0, 0, W, H);

            // ── Hero-style grid lines (32px, radial-masked) ──
            // We simulate the mask by varying opacity based on distance from center
            const gridSize = 32;
            ctx.save();
            for (let x = 0; x <= W; x += gridSize) {
                const dx = x - W/2;
                const fade = Math.max(0, 1 - (Math.abs(dx) / (W * 0.7)));
                ctx.strokeStyle = `rgba(255,255,255,${0.045 * fade})`;
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, H);
                ctx.stroke();
            }
            for (let y = 0; y <= H; y += gridSize) {
                const dy = y - H/2;
                const fade = Math.max(0, 1 - (Math.abs(dy) / (H * 0.7)));
                ctx.strokeStyle = `rgba(255,255,255,${0.045 * fade})`;
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(W, y);
                ctx.stroke();
            }
            ctx.restore();

            // ── Diagonal scan lines (top-left & bottom-right corners) ──
            ctx.save();
            ctx.lineWidth = 1;
            const diagStep = 48;
            // top-left corner diagonals
            for (let i = -H; i < W; i += diagStep) {
                const sx = i, sy = 0, ex = i + H, ey = H;
                const cx1 = Math.max(0, Math.min(W, sx));
                const dist = Math.hypot(cx1 - 0, H*0.5 - H*0.5) / W;
                const alpha = Math.max(0, 0.04 - dist * 0.04);
                ctx.strokeStyle = `rgba(22,196,196,${alpha})`;
                ctx.beginPath();
                ctx.moveTo(sx, sy);
                ctx.lineTo(ex, ey);
                ctx.stroke();
            }
            ctx.restore();

            // ── Subtle vignette ──
            const vignette = ctx.createRadialGradient(W/2, H/2, H*0.3, W/2, H/2, H);
            vignette.addColorStop(0,   'rgba(0,0,0,0)');
            vignette.addColorStop(1,   'rgba(0,0,0,0.55)');
            ctx.fillStyle = vignette;
            ctx.fillRect(0, 0, W, H);

            // ── Central glow pulse ──
            const glow = ctx.createRadialGradient(W/2, H/2, 0, W/2, H/2, 350);
            glow.addColorStop(0,   'rgba(22,196,196,0.1)');
            glow.addColorStop(0.5, 'rgba(82,194,40,0.05)');
            glow.addColorStop(1,   'rgba(0,0,0,0)');
            ctx.fillStyle = glow;
            ctx.fillRect(0, 0, W, H);

            // ── Logo ──
            if (titleImg.complete && titleImg.naturalWidth) {
                const maxW = W * logoScalePct;
                const ratio = titleImg.naturalHeight / titleImg.naturalWidth;
                const lw = maxW;
                const lh = maxW * ratio;
                const lx = (W - lw) / 2;
                const ly = (H - lh) / 2 + logoYOff;

                // drop shadow glow
                ctx.save();
                ctx.shadowColor  = 'rgba(22,196,196,0.55)';
                ctx.shadowBlur   = 60;
                ctx.drawImage(titleImg, lx, ly, lw, lh);
                ctx.shadowBlur = 0;
                ctx.restore();

                // tagline below logo
                if (tagline) {
                    const tagY = ly + lh + 40;
                    ctx.font      = '600 32px "Segoe UI", sans-serif';
                    ctx.textAlign = 'center';
                    ctx.fillStyle = 'rgba(255,255,255,0.75)';
                    ctx.fillText(tagline, W/2, tagY);
                }
            }

            // ── Bottom bar ──
            const barGrad = ctx.createLinearGradient(0, 0, W, 0);
            barGrad.addColorStop(0,   'rgba(82,194,40,0.7)');
            barGrad.addColorStop(0.5, 'rgba(22,196,196,0.7)');
            barGrad.addColorStop(1,   'rgba(82,194,40,0.7)');
            ctx.fillStyle = barGrad;
            ctx.fillRect(0, H - 5, W, 5);

            // ── Domain label ──
            if (domain) {
                ctx.font      = '500 26px "Segoe UI", sans-serif';
                ctx.textAlign = 'right';
                ctx.fillStyle = 'rgba(22,196,196,0.6)';
                ctx.fillText(domain, W - 36, H - 24);
            }
        }

        // ── Download ──
        document.getElementById('dlBtn').addEventListener('click', () => {
            draw();
            const link = document.createElement('a');
            link.download = 'tsnsmp-og-s3.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        });
    </script>
</body>
</html>
