name = "tsnsmp"
compatibility_date = "2025-05-15"
main = "worker.js"

# Runs automatically before `wrangler deploy`/`wrangler dev` (and before
# Cloudflare's own git-integration builds, if that's how this is deployed) —
# without this, a deploy would ship whatever is already sitting in ./dist
# instead of building fresh from source.
[build]
command = "npm run build"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "404-page"
# Without this, requests are matched against static assets BEFORE the Worker
# script runs at all -- meaning the hostname redirect in worker.js would
# never fire for the old domain, since / matches dist/index.html directly.
run_worker_first = true
